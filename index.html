<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Clock Control</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-danger {
      background: var(--danger-color);
      color: white;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .alarm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }

    .alarm-item:last-child {
      border-bottom: none;
    }

    .alarm-time {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="time"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      flex-grow: 1;
    }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }

    #responseLog {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ESP32 Clock Dashboard</h1>

    <!-- Connection Section -->
    <div class="card">
      <button id="connectBtn" class="btn" onclick="connectBLE()">Connect to ESP32 Clock</button>
      <div id="status">Status: Disconnected</div>
    </div>

    <!-- Set New Alarm -->
    <div class="card">
      <h3>Set New Alarm</h3>
      <div class="input-group">
        <input type="time" id="alarmTimeInput" value="07:00">
        <button class="btn btn-small" onclick="addAlarm()">Add Alarm</button>
      </div>
    </div>

    <!-- Alarm Slots -->
    <div class="card">
      <h3>Alarms (0 - 4)</h3>
      <button class="btn btn-small" style="margin-bottom: 10px;" onclick="getAlarms()">Refresh List</button>
      <div id="alarmList">
        <p style="color: #64748b; text-align: center;">Connect via BLE to load alarms.</p>
      </div>
    </div>

    <!-- Debug Log -->
    <div class="card">
      <h3>BLE Log</h3>
      <div id="responseLog">Awaiting connection...</div>
    </div>
  </div>

  <script>
    // Nordic UART Service UUIDs matching ESP32 Sketch
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Write to ESP32
    const CHARACTERISTIC_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Receive from ESP32

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;

      async function connectBLE() {
        try {
          log("Requesting Bluetooth Device...");
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ESP32-Alarm-Clock' }],
            optionalServices: [SERVICE_UUID]
          });
  
          bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
  
          log("Connecting to GATT Server...");
          const server = await bleDevice.gatt.connect();
  
          log("Getting Service...");
          const service = await server.getPrimaryService(SERVICE_UUID);
  
          log("Getting Characteristics...");
          rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_TX);
  
          // Start Notifications
          await txCharacteristic.startNotifications();
          txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
  
          document.getElementById('status').innerText = "Status: Connected to " + bleDevice.name;
          document.getElementById('connectBtn').innerText = "Disconnect";
          document.getElementById('connectBtn').onclick = disconnectBLE;
  
          log("Connected successfully!");
          
          // Fetch current alarm state
          getAlarms();
  
        } catch (error) {
          log("Error: " + error);
        }
      }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById('status').innerText = "Status: Disconnected";
      document.getElementById('connectBtn').innerText = "Connect to ESP32 Clock";
      document.getElementById('connectBtn').onclick = connectBLE;
      log("Disconnected from device.");
    }

    async function sendCommand(command) {
      if (!rxCharacteristic) {
        alert("Please connect to the clock first!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(command));
        log("Sent: " + command);
      } catch (error) {
        log("Send error: " + error);
      }
    }

    function handleNotifications(event) {
      const value = new TextDecoder().decode(event.target.value);
      log("Received: " + value);

      // Parse list formatting output if response contains TIME=
      if (value.startsWith("TIME=")) {
        parseAndRenderList(value);
      }
    }

    function parseAndRenderList(dataString) {
      const alarmListDiv = document.getElementById('alarmList');
      alarmListDiv.innerHTML = '';

      // Format string example: TIME=14:30 | [0]7:30(ON) [1]8:00(OFF)
      const parts = dataString.split('|');
      const alarmsRaw = parts[1].trim().split(' ');

      alarmsRaw.forEach((item, index) => {
        // Matches format [ID]HH:MM(STATUS)
        const match = item.match(/\[(\d+)\](\d+:\d+)\((ON\vert{}OFF)\)/);
        if (match) {
          const id = match[1];
          const time = match[2];
          const isOn = match[3] === 'ON';

          const alarmElement = document.createElement('div');
          alarmElement.className = 'alarm-item';
          alarmElement.innerHTML = `
            <div>
              <span class="alarm-time">${time}</span>
              <span style="font-size: 0.8rem; color: #94a3b8; margin-left: 8px;">Slot #${id}</span>
            </div>
            <div>
              <button class="btn btn-small ${isOn ? 'btn-danger' : ''}" 
                      onclick="${isOn ? `disableAlarm(${id})` : `enableAlarm(${id})`}">
                ${isOn ? 'Disable' : 'Enable'}
              </button>
              <button class="btn btn-small" style="background:#475569; color:white;" onclick="clearAlarm(${id})">Clear</button>
            </div>
          `;
          alarmListDiv.appendChild(alarmElement);
        }
      });
    }

    function addAlarm() {
      const timeVal = document.getElementById('alarmTimeInput').value;
      if (timeVal) {
        sendCommand(`ADD:${timeVal}`);
        setTimeout(getAlarms, 300); // refresh list
      }
    }

    function enableAlarm(id) {
      sendCommand(`ENABLE:${id}`);
      setTimeout(getAlarms, 300);
    }

    function disableAlarm(id) {
      sendCommand(`DISABLE:${id}`);
      setTimeout(getAlarms, 300);
    }

    function clearAlarm(id) {
      sendCommand(`CLEAR:${id}`);
      setTimeout(getAlarms, 300);
    }

    function getAlarms() {
      sendCommand('LIST');
    }

    function log(message) {
      const logDiv = document.getElementById('responseLog');
      logDiv.innerText += "\n" + message;
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  </script>
</body>
</html>
