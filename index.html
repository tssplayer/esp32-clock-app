<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Clock Control</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    /* Alarm Item Layout */
    .alarm-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .alarm-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Clickable Time Button */
    .time-btn {
      background: none;
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      font-size: 1.3rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .time-btn:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      margin-left: 6px;
    }

    .badge-repeat {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .badge-once {
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
      border: 1px solid #eab308;
    }

    .days-summary {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      gap: 4px;
    }

    .day-pill {
      padding: 2px 5px;
      border-radius: 3px;
      background: #1e293b;
      color: #475569;
    }

    .day-pill.active {
      background: #38bdf8;
      color: #000;
      font-weight: bold;
    }

    /* Controls (Toggle + Clear) */
    .alarm-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--success-color);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* 'X' Clear Button */
    .btn-clear-x {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s;
    }

    .btn-clear-x:hover {
      background: var(--danger-color);
      color: white;
    }

    /* Add Plus Button */
    .btn-add-plus {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border: 2px dashed var(--accent-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-add-plus:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }

    input[type="time"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .day-selector {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-top: 8px;
    }

    .day-btn {
      background: #0f172a;
      color: #64748b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 0;
      width: 100%;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .day-btn.selected {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }

    #responseLog {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ESP32 Clock Dashboard</h1>

    <!-- BLE Connection Card -->
    <div class="card">
      <button id="connectBtn" class="btn" onclick="connectBLE()">Connect to ESP32 Clock</button>
      <div id="status">Status: Disconnected</div>
    </div>

    <!-- Active Alarms List Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0;">Active Alarms</h3>
        <button class="btn btn-small" style="background: #334155; color: white;" onclick="getAlarms()">Refresh</button>
      </div>
      
      <div id="alarmList">
        <p style="color: #64748b; text-align: center;">Connect via BLE to load alarms.</p>
      </div>

      <button id="addAlarmPlusBtn" class="btn-add-plus" onclick="openAddModal()" style="display: none;">
        <span>+</span> Add Alarm
      </button>
    </div>

    <!-- Debug Log -->
    <div class="card">
      <h3>BLE Log</h3>
      <div id="responseLog">Awaiting connection...</div>
    </div>
  </div>

  <!-- Add/Edit Alarm Modal Popup -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modalTitle" style="text-align: center; margin-bottom: 16px;">Set New Alarm</h3>
      
      <input type="time" id="newAlarmTime" value="07:00">

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label for="repeatToggle" style="font-size: 0.95rem; font-weight: bold;">Repeat Alarm</label>
        <label class="switch">
          <input type="checkbox" id="repeatToggle" onchange="toggleRepeatOptions(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Days of Week Selection (Hidden for One-Time Alarms) -->
      <div id="daysContainer" class="form-group" style="display: none;">
        <label style="font-size: 0.85rem; color: #94a3b8;">Repeat Days</label>
        <div class="day-selector">
          <button type="button" class="day-btn selected" data-day="0" onclick="toggleDayBtn(this)">S</button>
          <button type="button" class="day-btn selected" data-day="1" onclick="toggleDayBtn(this)">M</button>
          <button type="button" class="day-btn selected" data-day="2" onclick="toggleDayBtn(this)">T</button>
          <button type="button" class="day-btn selected" data-day="3" onclick="toggleDayBtn(this)">W</button>
          <button type="button" class="day-btn selected" data-day="4" onclick="toggleDayBtn(this)">T</button>
          <button type="button" class="day-btn selected" data-day="5" onclick="toggleDayBtn(this)">F</button>
          <button type="button" class="day-btn selected" data-day="6" onclick="toggleDayBtn(this)">S</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" style="background: #475569; color: white;" onclick="closeAddModal()">Cancel</button>
        <button class="btn" onclick="confirmSaveAlarm()">Save Alarm</button>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let bleRxBuffer = "";
    let activeAlarmsCount = 0;
    let editingSlotId = -1; // -1 = Adding new alarm
    const MAX_SLOTS = 5;
    const DAY_NAMES = ["S", "M", "T", "W", "T", "F", "S"];

    async function connectBLE() {
      try {
        log("Requesting Bluetooth Device...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Connecting to GATT Server...");
        const server = await bleDevice.gatt.connect();

        log("Getting Service...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        log("Getting Characteristics...");
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('status').innerText = "Status: Connected to " + bleDevice.name;
        document.getElementById('connectBtn').innerText = "Disconnect";
        document.getElementById('connectBtn').onclick = disconnectBLE;

        log("Connected successfully!");
        getAlarms();

      } catch (error) {
        log("Error: " + error);
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById('status').innerText = "Status: Disconnected";
      document.getElementById('connectBtn').innerText = "Connect to ESP32 Clock";
      document.getElementById('connectBtn').onclick = connectBLE;
      document.getElementById('addAlarmPlusBtn').style.display = 'none';
      log("Disconnected from device.");
    }

    function handleNotifications(event) {
      const chunk = new TextDecoder().decode(event.target.value);
      bleRxBuffer += chunk;

      if (bleRxBuffer.includes('\n') || bleRxBuffer.includes('\r')) {
        processCompleteMessage(bleRxBuffer.trim());
        bleRxBuffer = "";
      }
    }

    function processCompleteMessage(fullDataString) {
      if (fullDataString.includes("TIME=")) {
        parseAndRenderList(fullDataString);
      }
    }

    function parseAndRenderList(dataString) {
      const alarmListDiv = document.getElementById('alarmList');
      alarmListDiv.innerHTML = '';

      const cleanData = dataString.replace(/[\r\n]/g, '').trim();
      const parts = cleanData.split('|');
      if (parts.length < 2) return;

      const alarmsSection = parts[1].trim();
      const alarmTokens = alarmsSection.split(/\s+/);

      let displayedAlarms = 0;
      activeAlarmsCount = 0;

      alarmTokens.forEach(token => {
        if (token.includes('[') && token.includes(']')) {
          try {
            const id = parseInt(token.substring(token.indexOf('[') + 1, token.indexOf(']')));
            const afterId = token.substring(token.indexOf(']') + 1);

            const rawTime = afterId.substring(0, afterId.indexOf('('));
            const params = afterId.substring(afterId.indexOf('(') + 1, afterId.indexOf(')')).split(',');

            const isOn = params[0].toUpperCase() === 'ON';
            const isRepeat = params[1].toUpperCase() === 'R';
            const dayMask = params[2] || "1111111";

            let formattedTime = rawTime;
            const timeParts = rawTime.split(':');
            if (timeParts.length >= 2) {
              formattedTime = `${timeParts[0].padStart(2, '0')}:${timeParts[1].padStart(2, '0')}`;
            }

            const isSet = !(formattedTime === "00:00" && !isOn);

            if (isSet) {
              displayedAlarms++;
              activeAlarmsCount++;

              // Render Day Summary Pills
              let daysHtml = '';
              for (let d = 0; d < 7; d++) {
                const activeClass = (isRepeat && dayMask.charAt(d) === '1') ? 'active' : '';
                daysHtml += `<span class="day-pill ${activeClass}">${DAY_NAMES[d]}</span>`;
              }

              const alarmElement = document.createElement('div');
              alarmElement.className = 'alarm-item';
              alarmElement.innerHTML = `
                <div class="alarm-main-row">
                  <div>
                    <button class="time-btn" title="Click to edit alarm" onclick="openEditModal(${id}, '${formattedTime}', ${isRepeat}, '${dayMask}')">
                      ${formattedTime}
                    </button>
                    <span class="badge ${isRepeat ? 'badge-repeat' : 'badge-once'}">
                      ${isRepeat ? 'Repeating' : 'One-Time'}
                    </span>
                  </div>
                  <div class="alarm-controls">
                    <label class="switch">
                      <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleAlarm(${id}, this.checked)">
                      <span class="slider"></span>
                    </label>
                    <button class="btn-clear-x" title="Clear Alarm" onclick="clearAlarm(${id})">✕</button>
                  </div>
                </div>
                ${isRepeat ? `<div class="days-summary">${daysHtml}</div>` : ''}
              `;
              alarmListDiv.appendChild(alarmElement);
            }
          } catch (err) {
            console.error("Token parse error:", token, err);
          }
        }
      });

      if (displayedAlarms === 0) {
        alarmListDiv.innerHTML = `<p style="color: #64748b; text-align: center;">No active alarms set.</p>`;
      }

      updatePlusButtonVisibility();
    }

    function updatePlusButtonVisibility() {
      const plusBtn = document.getElementById('addAlarmPlusBtn');
      if (bleDevice && bleDevice.gatt.connected && activeAlarmsCount < MAX_SLOTS) {
        plusBtn.style.display = "flex";
      } else {
        plusBtn.style.display = "none";
      }
    }

    function toggleRepeatOptions(isRepeating) {
      document.getElementById('daysContainer').style.display = isRepeating ? 'block' : 'none';
    }

    function toggleDayBtn(btn) {
      btn.classList.toggle('selected');
    }

    function openAddModal() {
      editingSlotId = -1;
      document.getElementById('modalTitle').innerText = "Set New Alarm";
      document.getElementById('newAlarmTime').value = "07:00";
      document.getElementById('repeatToggle').checked = false; // Default One-Time
      toggleRepeatOptions(false);
      
      // Select all days by default for when repeat is toggled on
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.add('selected'));
      document.getElementById('addModal').style.display = 'flex';
    }

    function openEditModal(slotId, currentTime, isRepeat, dayMask) {
      editingSlotId = slotId;
      document.getElementById('modalTitle').innerText = `Edit Alarm #${slotId}`;
      document.getElementById('newAlarmTime').value = currentTime;
      document.getElementById('repeatToggle').checked = isRepeat;
      toggleRepeatOptions(isRepeat);

      // Restore day selections
      document.querySelectorAll('.day-btn').forEach((btn, index) => {
        if (dayMask.charAt(index) === '1') {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });

      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    function confirmSaveAlarm() {
      const timeVal = document.getElementById('newAlarmTime').value;
      const isRepeat = document.getElementById('repeatToggle').checked ? 1 : 0;
      
      // Build 7-bit string representation of selected days
      let daysMask = "";
      document.querySelectorAll('.day-btn').forEach(btn => {
        daysMask += btn.classList.contains('selected') ? "1" : "0";
      });

      if (timeVal) {
        if (editingSlotId === -1) {
          sendBLECommand(`ADD:${timeVal},${isRepeat},${daysMask}`);
        } else {
          sendBLECommand(`SET:${editingSlotId},${timeVal},${isRepeat},${daysMask}`);
        }
        closeAddModal();
      }
    }

    function toggleAlarm(slotId, enable) {
      sendBLECommand(enable ? `ENABLE:${slotId}` : `DISABLE:${slotId}`);
    }

    function clearAlarm(slotId) {
      sendBLECommand(`CLEAR:${slotId}`);
    }

    function getAlarms() {
      sendBLECommand('LIST');
    }

    async function sendBLECommand(commandStr) {
      if (!rxCharacteristic) {
        alert("Please connect to the clock first!");
        return;
      }
      try {
        log("Sending: " + commandStr);
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(commandStr + "\n"));
      } catch (error) {
        log("Send error: " + error);
      }
    }

    function log(message) {
      const logDiv = document.getElementById('responseLog');
      logDiv.innerText += "\n" + message;
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  </script>
</body>
</html>
