<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Clock Control</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    /* Alarm Item Layout */
    .alarm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .alarm-item:last-child {
      margin-bottom: 0;
    }

    /* Clickable Time Button */
    .time-btn {
      background: none;
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      font-size: 1.3rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .time-btn:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    /* Right Controls (Toggle + Clear) */
    .alarm-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--success-color);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Compact 'X' Clear Button */
    .btn-clear-x {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s;
    }

    .btn-clear-x:hover {
      background: var(--danger-color);
      color: white;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="time"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      flex-grow: 1;
    }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }

    #responseLog {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ESP32 Clock Dashboard</h1>

    <!-- BLE Connection Card -->
    <div class="card">
      <button id="connectBtn" class="btn" onclick="connectBLE()">Connect to ESP32 Clock</button>
      <div id="status">Status: Disconnected</div>
    </div>

    <!-- Active Alarms List -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0;">Active Alarms</h3>
        <button class="btn btn-small" style="background: #334155; color: white;" onclick="getAlarms()">Refresh</button>
      </div>
      <div id="alarmList">
        <p style="color: #64748b; text-align: center;">Connect via BLE to load alarms.</p>
      </div>
    </div>

    <!-- Add New Alarm Card (Positioned at Bottom) -->
    <div id="addAlarmCard" class="card">
      <h3>Set New Alarm</h3>
      <div class="input-group">
        <input type="time" id="newAlarmTime" value="07:00">
        <button id="addAlarmBtn" class="btn btn-small" onclick="addNewAlarm()">Add Alarm</button>
      </div>
      <p id="maxAlarmsNotice" style="color: var(--danger-color); font-size: 0.85rem; display: none; margin-top: 8px; text-align: center;">
        Maximum limit reached (5/5 active alarms).
      </p>
    </div>

    <!-- Debug Log -->
    <div class="card">
      <h3>BLE Log</h3>
      <div id="responseLog">Awaiting connection...</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;
    let bleRxBuffer = "";
    let activeAlarmsCount = 0;
    const MAX_SLOTS = 5;

    async function connectBLE() {
      try {
        log("Requesting Bluetooth Device...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Connecting to GATT Server...");
        const server = await bleDevice.gatt.connect();

        log("Getting Service...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        log("Getting Characteristics...");
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('status').innerText = "Status: Connected to " + bleDevice.name;
        document.getElementById('connectBtn').innerText = "Disconnect";
        document.getElementById('connectBtn').onclick = disconnectBLE;

        log("Connected successfully!");
        getAlarms();

      } catch (error) {
        log("Error: " + error);
      }
    }

    function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById('status').innerText = "Status: Disconnected";
      document.getElementById('connectBtn').innerText = "Connect to ESP32 Clock";
      document.getElementById('connectBtn').onclick = connectBLE;
      log("Disconnected from device.");
    }

    function handleNotifications(event) {
      const chunk = new TextDecoder().decode(event.target.value);
      log("Received Chunk: " + chunk);

      bleRxBuffer += chunk;

      if (bleRxBuffer.includes('\n') || bleRxBuffer.includes('\r')) {
        processCompleteMessage(bleRxBuffer.trim());
        bleRxBuffer = "";
      }
    }

    function processCompleteMessage(fullDataString) {
      log("Processing: " + fullDataString);

      if (fullDataString.includes("TIME=")) {
        parseAndRenderList(fullDataString);
      }
    }

    function parseAndRenderList(dataString) {
      const alarmListDiv = document.getElementById('alarmList');
      alarmListDiv.innerHTML = '';

      const cleanData = dataString.replace(/[\r\n]/g, '').trim();
      const parts = cleanData.split('|');

      if (parts.length < 2) return;

      const alarmsSection = parts[1].trim();
      const alarmTokens = alarmsSection.split(/\s+/);

      let displayedAlarms = 0;
      activeAlarmsCount = 0;

      alarmTokens.forEach(token => {
        if (token.includes('[') && token.includes(']')) {
          try {
            const id = parseInt(token.substring(token.indexOf('[') + 1, token.indexOf(']')));
            const afterId = token.substring(token.indexOf(']') + 1);

            const rawTime = afterId.substring(0, afterId.indexOf('('));
            const statusRaw = afterId.substring(afterId.indexOf('(') + 1, afterId.indexOf(')'));
            const isOn = statusRaw.toUpperCase() === 'ON';

            let formattedTime = rawTime;
            const timeParts = rawTime.split(':');
            if (timeParts.length >= 2) {
              formattedTime = `${timeParts[0].padStart(2, '0')}:${timeParts[1].padStart(2, '0')}`;
            }

            // Exclude disabled 00:00 alarms from rendering
            const isSet = !(formattedTime === "00:00" && !isOn);

            if (isSet) {
              displayedAlarms++;
              activeAlarmsCount++;

              const alarmElement = document.createElement('div');
              alarmElement.className = 'alarm-item';
              alarmElement.innerHTML = `
                <div>
                  <button class="time-btn" title="Click to edit time" onclick="editAlarmTime(${id}, '${formattedTime}')">
                    ${formattedTime}
                  </button>
                  <span style="font-size: 0.75rem; color: #64748b; margin-left: 6px;">Slot #${id}</span>
                </div>
                <div class="alarm-controls">
                  <label class="switch">
                    <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleAlarm(${id}, this.checked)">
                    <span class="slider"></span>
                  </label>
                  <button class="btn-clear-x" title="Clear Alarm" onclick="clearAlarm(${id})">✕</button>
                </div>
              `;
              alarmListDiv.appendChild(alarmElement);
            }
          } catch (err) {
            console.error("Token parse error:", token, err);
          }
        }
      });

      if (displayedAlarms === 0) {
        alarmListDiv.innerHTML = `<p style="color: #64748b; text-align: center;">No active alarms set.</p>`;
      }

      updateAddButtonState();
    }

    function updateAddButtonState() {
      const addBtn = document.getElementById('addAlarmBtn');
      const maxNotice = document.getElementById('maxAlarmsNotice');

      if (activeAlarmsCount >= MAX_SLOTS) {
        addBtn.disabled = true;
        addBtn.style.opacity = "0.5";
        addBtn.style.cursor = "not-allowed";
        maxNotice.style.display = "block";
      } else {
        addBtn.disabled = false;
        addBtn.style.opacity = "1";
        addBtn.style.cursor = "pointer";
        maxNotice.style.display = "none";
      }
    }

    function toggleAlarm(slotId, enable) {
      const cmd = enable ? `ENABLE:${slotId}` : `DISABLE:${slotId}`;
      sendBLECommand(cmd);
    }

    function editAlarmTime(slotId, currentTime) {
      const newTime = prompt(`Edit time for Slot #${slotId}:`, currentTime);
      if (newTime && newTime !== currentTime) {
        if (/^\d{2}:\d{2}$/.test(newTime)) {
          sendBLECommand(`SET:${slotId},${newTime}`);
        } else {
          alert("Invalid time format. Please use HH:MM format (e.g., 07:30).");
        }
      }
    }

    function addNewAlarm() {
      const timeVal = document.getElementById('newAlarmTime').value;
      if (timeVal) {
        sendBLECommand(`ADD:${timeVal}`);
      }
    }

    function clearAlarm(slotId) {
      sendBLECommand(`CLEAR:${slotId}`);
    }

    function getAlarms() {
      sendBLECommand('LIST');
    }

    async function sendBLECommand(commandStr) {
      if (!rxCharacteristic) {
        alert("Please connect to the clock first!");
        return;
      }
      try {
        log("Sending: " + commandStr);
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(commandStr + "\n"));
        setTimeout(getAlarms, 300);
      } catch (error) {
        log("Send error: " + error);
      }
    }

    function log(message) {
      const logDiv = document.getElementById('responseLog');
      logDiv.innerText += "\n" + message;
      logDiv.scrollTop = logDiv.scrollHeight;
    }
  </script>
</body>
</html>
